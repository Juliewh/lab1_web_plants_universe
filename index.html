<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants universe — магазин комнатных растений</title>
    <link rel="icon" href="images/favicon.avif">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="container">
            <a href="#catalog" class="logo">Plants universe</a>

            <nav class="navigation">
                <a href="#catalog">Каталог</a>
                <a href="#cart">Корзина</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="catalog" id="catalog">
            <div class="container">
                <h1>Комнатные растения</h1>
                <p class="catalog-description">
                    Растения, которые сделают ваш дом уютнее
                </p>

                <div class="products"></div>
            </div>
        </section>

        <section class="cart" id="cart">
            <div class="container">
                <h2>Корзина</h2>

                <div class="cart-content">
                    <div class="cart-items">
                        <p>Корзина пуста</p>
                    </div>

                    <p class="cart-total">
                        Итого: <span>0 ₽</span>
                    </p>

                    <button class="checkout-button" type="button">
                        Оформить заказ
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div class="modal" id="order-modal">
        <div class="modal-content">
    
            <button
                class="modal-close"
                type="button"
                aria-label="Закрыть"
            >
                ×
            </button>
    
            <h2>Оформление заказа</h2>
    
            <form class="order-form">
    
                <div class="form-field">
                    <label for="first-name">Имя</label>
                    <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        required
                    >
                </div>
    
                <div class="form-field">
                    <label for="last-name">Фамилия</label>
                    <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        required
                    >
                </div>
    
                <div class="form-field">
                    <label for="address">Адрес доставки</label>
                    <input
                        type="text"
                        id="address"
                        name="address"
                        required
                    >
                </div>
    
                <div class="form-field">
                    <label for="phone">Контактный номер телефона</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                    >
                </div>
    
                <button class="order-button" type="submit">
                    Создать заказ
                </button>
    
            </form>

            <p class="order-success" hidden>Заказ создан!</p>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Plants universe. Магазин комнатных растений.</p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
